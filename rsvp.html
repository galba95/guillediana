<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>RSVP — Diana &amp; Guillaume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--blue:#738B78;--blue-deep:#29414D;--bordeaux:#71889A;--bordeaux-deep:#56707F;--sand:#C4A46B;--sand-light:#F0ECE1;--cream:#F5F3EE;--ink:#26323C;--ink-soft:#5B6772;--white:#fff;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--max:640px}
*{box-sizing:border-box}html{background:var(--cream)}body{margin:0;font-family:var(--sans);background:var(--cream);color:var(--ink);line-height:1.65;font-size:16px}a{color:var(--bordeaux)}h1,h2{font-family:var(--serif);font-weight:500;color:var(--blue-deep);margin:0 0 .3em}.wrap{max-width:var(--max);margin:0 auto;padding:56px 24px 96px}.topbar{padding:20px 24px}.back-link{font-size:.9rem;text-decoration:none;color:var(--ink-soft)}.back-link:hover{color:var(--bordeaux)}.langgroup{display:inline-flex;border:1px solid var(--sand);border-radius:999px;overflow:hidden;float:right}.langgroup button{font-family:var(--sans);font-size:12px;font-weight:500;border:none;background:transparent;color:var(--ink-soft);padding:4px 12px;cursor:pointer}.langgroup button[aria-pressed=true]{background:var(--blue);color:#fff}h1{text-align:center;font-size:clamp(2.2rem,6vw,3rem);font-weight:400}.deadline-note{text-align:center;color:var(--ink-soft);font-size:.95rem;margin-bottom:40px}form{display:flex;flex-direction:column;gap:22px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:22px}.field label,fieldset.field legend{display:block;font-size:.9rem;font-weight:500;margin-bottom:6px;color:var(--ink)}.field input[type=text],.field input[type=email],.field textarea{width:100%;padding:10px 12px;font-family:var(--sans);font-size:1rem;border:1px solid var(--sand);border-radius:6px;background:var(--white);color:var(--ink)}.field input:focus-visible,.field textarea:focus-visible{outline:2px solid var(--bordeaux);outline-offset:1px}textarea{min-height:90px;resize:vertical}fieldset.field{border:none;padding:0;margin:0}.radio-row{display:flex;gap:22px;flex-wrap:wrap}.radio-row label{display:flex;align-items:center;gap:6px;font-weight:400;font-size:1rem}.field-error{color:var(--bordeaux-deep);font-size:.85rem;margin:.35em 0 0;min-height:1.1em}.btn{align-self:center;background:var(--blue);color:#fff;border:none;padding:13px 34px;border-radius:999px;font-family:var(--sans);font-size:1rem;font-weight:500;cursor:pointer;margin-top:8px}.btn:hover{background:var(--blue-deep)}.btn:disabled{opacity:.65;cursor:wait}#rsvp-success{display:none;border:1px solid var(--sand);background:var(--white);border-radius:8px;padding:32px;text-align:center;color:var(--blue-deep)}
@media(max-width:560px){.row2{grid-template-columns:1fr}.wrap{padding-left:20px;padding-right:20px}.topbar{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
<div class="topbar"><a class="back-link" href="index.html" data-i18n="back_link">← Retour au site</a><div class="langgroup" role="group" aria-label="Choix de langue / Selección de idioma"><button id="lang-fr" type="button" aria-pressed="true">FR</button><button id="lang-es" type="button" aria-pressed="false">ES</button></div></div>
<div class="wrap">
<h1>RSVP</h1><p class="deadline-note" data-i18n="rsvp_deadline">Réponse attendue avant le 30 janvier 2027 — une réponse par invité(e).</p>
<form id="rsvp-form" novalidate>
<div class="row2"><div class="field"><label for="f-nom" data-i18n="label_nom">Nom</label><input type="text" id="f-nom" name="nom"><p class="field-error" id="err-nom" role="alert"></p></div><div class="field"><label for="f-prenom" data-i18n="label_prenom">Prénom</label><input type="text" id="f-prenom" name="prenom"><p class="field-error" id="err-prenom" role="alert"></p></div></div>
<div class="field"><label for="f-email" data-i18n="label_email">Email</label><input type="email" id="f-email" name="email"><p class="field-error" id="err-email" role="alert"></p></div>
<fieldset class="field"><legend data-i18n="label_presence">Serez-vous présent(e) ?</legend><div class="radio-row"><label><input type="radio" name="presence" value="oui"><span data-i18n="yes">Oui</span></label><label><input type="radio" name="presence" value="non"><span data-i18n="no">Non</span></label></div><p class="field-error" id="err-presence" role="alert"></p></fieldset>
<fieldset class="field"><legend data-i18n="label_vege">Régime végétarien ?</legend><div class="radio-row"><label><input type="radio" name="vege" value="oui"><span data-i18n="yes">Oui</span></label><label><input type="radio" name="vege" value="non"><span data-i18n="no">Non</span></label></div><p class="field-error" id="err-vege" role="alert"></p></fieldset>
<fieldset class="field"><legend data-i18n="label_allergies">Allergie alimentaire ?</legend><div class="radio-row"><label><input type="radio" name="allergies" value="oui"><span data-i18n="yes">Oui</span></label><label><input type="radio" name="allergies" value="non"><span data-i18n="no">Non</span></label></div><p class="field-error" id="err-allergies" role="alert"></p><div id="allergies-detail-wrap" style="display:none;margin-top:14px"><label for="f-allergies-detail" data-i18n="label_allergies_detail">Précisez</label><input type="text" id="f-allergies-detail" name="allergies_detail"><p class="field-error" id="err-allergies-detail" role="alert"></p></div></fieldset>
<div class="field"><label for="f-comment" data-i18n="label_comment">Un mot pour nous ?</label><textarea id="f-comment" name="comment"></textarea></div><p class="field-error" id="err-form" role="alert"></p><button class="btn" id="submit-btn" type="submit" data-i18n="submit">Envoyer</button>
</form>
<div id="rsvp-success"><p data-i18n="success_msg" style="margin:0;font-family:var(--serif);font-size:1.35rem">Merci, votre réponse a bien été enregistrée. ❤️</p></div>
</div>
<script>
(function(){
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbwx00nU9za3wJ70XD_lE2uhVu-ltGyk6ueVEfp4AjssDreiKw_40odBdlfiAayk-wrwuQ/exec';
const translations={fr:{back_link:'← Retour au site',rsvp_deadline:'Réponse attendue avant le 30 janvier 2027 — une réponse par invité(e).',label_nom:'Nom',label_prenom:'Prénom',label_email:'Email',label_presence:'Serez-vous présent(e) ?',yes:'Oui',no:'Non',label_vege:'Régime végétarien ?',label_allergies:'Allergie alimentaire ?',label_allergies_detail:'Précisez',label_comment:'Un mot pour nous ?',submit:'Envoyer',success_msg:'Merci, votre réponse a bien été enregistrée. ❤️',error_required:'Merci de remplir ce champ.',error_email:"Merci d'indiquer un email valide.",error_send:'Une erreur est survenue. Merci de réessayer.'},es:{back_link:'← Volver al sitio',rsvp_deadline:'Respuesta esperada antes del 30 de enero de 2027 — una respuesta por invitado/a.',label_nom:'Apellido',label_prenom:'Nombre',label_email:'Correo electrónico',label_presence:'¿Asistirá?',yes:'Sí',no:'No',label_vege:'¿Dieta vegetariana?',label_allergies:'¿Alguna alergia alimentaria?',label_allergies_detail:'Especifique',label_comment:'¿Algo que quiera decirnos?',submit:'Enviar',success_msg:'¡Gracias! Su respuesta ha sido registrada. ❤️',error_required:'Por favor, complete este campo.',error_email:'Indique un correo válido.',error_send:'Se ha producido un error. Inténtelo de nuevo.'}};
let currentLang=localStorage.getItem('site-lang')||'fr';const form=document.getElementById('rsvp-form'),successBox=document.getElementById('rsvp-success'),allergiesWrap=document.getElementById('allergies-detail-wrap'),submitBtn=document.getElementById('submit-btn');
function applyLang(lang){currentLang=lang;localStorage.setItem('site-lang',lang);document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(function(el){const key=el.dataset.i18n;if(translations[lang][key]!==undefined)el.textContent=translations[lang][key]});document.getElementById('lang-fr').setAttribute('aria-pressed',String(lang==='fr'));document.getElementById('lang-es').setAttribute('aria-pressed',String(lang==='es'))}
function error(id,key){document.getElementById(id).textContent=translations[currentLang][key]||''}function clearErrors(){document.querySelectorAll('.field-error').forEach(function(el){el.textContent=''})}
document.getElementById('lang-fr').onclick=function(){applyLang('fr')};document.getElementById('lang-es').onclick=function(){applyLang('es')};document.querySelectorAll('input[name=allergies]').forEach(function(r){r.addEventListener('change',function(){allergiesWrap.style.display=this.value==='oui'?'block':'none';if(this.value==='non')document.getElementById('f-allergies-detail').value=''})});
form.addEventListener('submit',async function(e){e.preventDefault();clearErrors();const d=new FormData(form),nom=(d.get('nom')||'').trim(),prenom=(d.get('prenom')||'').trim(),email=(d.get('email')||'').trim(),presence=d.get('presence'),vege=d.get('vege'),allergies=d.get('allergies'),detail=(d.get('allergies_detail')||'').trim(),comment=(d.get('comment')||'').trim();let bad=false;if(!nom){error('err-nom','error_required');bad=true}if(!prenom){error('err-prenom','error_required');bad=true}if(!email){error('err-email','error_required');bad=true}else if(!/^\S+@\S+\.\S+$/.test(email)){error('err-email','error_email');bad=true}if(!presence){error('err-presence','error_required');bad=true}if(!vege){error('err-vege','error_required');bad=true}if(!allergies){error('err-allergies','error_required');bad=true}if(allergies==='oui'&&!detail){error('err-allergies-detail','error_required');bad=true}if(bad)return;const payload=new URLSearchParams({nom:nom,prenom:prenom,email:email,presence:presence,vege:vege,allergies:allergies,allergies_detail:detail,comment:comment,lang:currentLang});submitBtn.disabled=true;try{await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',body:payload});form.style.display='none';successBox.style.display='block';successBox.scrollIntoView({behavior:'smooth',block:'center'})}catch(err){submitBtn.disabled=false;error('err-form','error_send')}});
applyLang(currentLang);
})();
</script>
</body>
</html>
